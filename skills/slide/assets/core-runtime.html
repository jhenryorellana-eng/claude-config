<!--
  ASOMBRO CORE RUNTIME (v2)

  This file contains ONLY non-visual scaffolding. It does NOT prescribe:
    - any chrome (brand mark, nav dots, pin tag, flag bars)
    - any hero geometry (clip-path, position, size)
    - any layout
    - any orbital ring or stat positions

  When generating a deck, copy this file as the starting point and ADD
  the visual code from your composed kit. Do not treat this file as a
  template to fill in — only the JS scaffold and base CSS are meant to
  be reused as-is.

  What this gives you:
    1. Responsive scale wrap (1280×720 design space → fits any viewport)
    2. GSAP timeline scaffold (paused, with labels you add)
    3. Master slide-state manager (linear advance vs interactive triggers)
    4. Event dispatcher for [data-trigger]+[data-action] interactions
    5. Keyboard navigation (←→ for linear slides, Escape for closing panels)

  What you ADD yourself based on the Direction Brief:
    - The <title> tag content
    - The Google Fonts <link>
    - The CSS variables in :root (--bg, --accent, --text, --muted, --display, --body)
    - All visual HTML (chrome, hero, stats, content panels)
    - All GSAP tweens between slide labels
    - All micro-interactions
-->

<style>

*/
:root {

  --accent: #c9a96e;
  --text: #f4f1eb;
  --muted: #807870;

/* ==========================================================
   ESSENTIAL RESET + STAGE
   ========================================================== */
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: #0a0a0a;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--body);
  overflow: hidden;
}

/* Responsive scaling wrapper — 1280×720 design space, scales to viewport */
#scale-wrap {
  width: 1280px; height: 720px;
  transform-origin: center center;
}

#deck {
  width: 1280px; height: 720px;
  background: var(--bg);
  color: var(--text);
  position: relative;
  overflow: hidden;
  box-shadow: 0 30px 80px rgba(0,0,0,.5);
  user-select: none;
}

/* Each slide is a stage. The runtime toggles .current and listens for clicks. */
.slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
  z-index: 1;
}
.slide.current {
  opacity: 1;
  pointer-events: auto;
  z-index: 2;
}

/* Linear slides get a click-anywhere advance cursor; interactive ones don't */
.slide[data-mode="linear"] { cursor: pointer; }
.slide[data-mode="interactive"] { cursor: default; }

/* Interactive triggers always get a pointer cursor */
[data-trigger] { cursor: pointer; }

/* ==========================================================
   COMPOSED VISUAL CODE GOES BELOW
   ==========================================================
   Add the chrome variant's CSS here.
   Add the layout primitives' CSS here.
   Add any accent geometry CSS here.
   Add font sizes, positions, clip-paths, etc. — composed per deck.
*/

<body>

<div id="scale-wrap">
<div id="deck">

  <!-- ==========================================================
       CHROME GOES HERE
       Composed from one of the 6 chrome variants in assets/kit/chrome/.
       Do NOT default to editorial-rail (paper-plane + dots + pin + flag).
       ========================================================== -->

  <!-- ==========================================================
       SHARED-MORPH ELEMENTS GO HERE
       The hero image, title, and any other element that morphs
       across slides lives OUTSIDE the .slide containers, at this
       level. They are single DOM nodes tweened between states.
       ========================================================== -->

  <!-- ==========================================================
       SLIDES GO HERE
       Each .slide is a stage. Compose from layouts/ kit.
       Hard rule: no two consecutive slides share the same layout primitive.
       ========================================================== -->

  <!-- Example structure (REPLACE with composed content):
  <div class="slide current" data-mode="linear" id="slide-1"></div>
  <div class="slide" data-mode="linear" id="slide-2"></div>
  <div class="slide" data-mode="interactive" id="slide-3"></div>
  -->

</div>
</div>

<script>
/* ==========================================================
   RESPONSIVE SCALE
   ========================================================== */
function fitScale() {
  const wrap = document.getElementById('scale-wrap');
  const sx = window.innerWidth / 1280;
  const sy = window.innerHeight / 720;
  const s = Math.min(sx, sy) * 0.95;
  wrap.style.transform = `scale(${s})`;
}
fitScale();
window.addEventListener('resize', fitScale);

/* ==========================================================
   SLIDE STATE MANAGER
   ==========================================================
   Tracks current slide, applies .current class, exposes goto().
   The visual transition between slides is handled by GSAP tweens
   in the master timeline (added per deck).
*/
const slides = Array.from(document.querySelectorAll('.slide'));
let currentIndex = 0;

function goto(targetIndex) {
  if (targetIndex < 0 || targetIndex >= slides.length) return;
  if (targetIndex === currentIndex) return;

  const direction = targetIndex > currentIndex ? 1 : -1;
  const prev = slides[currentIndex];
  const next = slides[targetIndex];

  // Visual transition: this is where the deck's master timeline runs.
  // Replace this default cross-fade with the morph tweens composed for
  // your deck — shared elements should TWEEN between states, not fade.
  prev.classList.remove('current');
  next.classList.add('current');

  // Hook for per-deck transition logic (defined when composing)
  if (typeof window.onSlideChange === 'function') {
    window.onSlideChange(targetIndex, currentIndex, direction);
  }

  currentIndex = targetIndex;
}

function next() { goto(currentIndex + 1); }
function prev() { goto(currentIndex - 1); }

/* ==========================================================
   LINEAR ADVANCE (click anywhere on linear slides)
   ========================================================== */
document.getElementById('deck').addEventListener('click', (e) => {
  // If the click was on an interactive trigger, the trigger handles it.
  if (e.target.closest('[data-trigger]')) return;

  // If the current slide is interactive, ignore the click here.
  const cur = slides[currentIndex];
  if (!cur || cur.dataset.mode === 'interactive') return;

  next();
});

/* ==========================================================
   KEYBOARD NAVIGATION
   ========================================================== */
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') { next(); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { prev(); e.preventDefault(); }
  else if (e.key === 'Escape') { closeTopmostPanel(); }
});

/* ==========================================================
   EVENT DISPATCHER (for [data-trigger] interactions)
   ==========================================================
   Pattern: <button data-trigger data-action="open" data-target="#panel-1">
   Supported actions: open, close, toggle, tab, zoom-in, zoom-out, reveal, hide
*/
const openPanels = []; // stack of open panel ids, topmost last

document.getElementById('deck').addEventListener('click', (e) => {
  const trigger = e.target.closest('[data-trigger]');
  if (!trigger) return;
  e.stopPropagation();

  const action = trigger.dataset.action;
  const target = trigger.dataset.target ? document.querySelector(trigger.dataset.target) : null;

  switch (action) {
    case 'open':
      if (target) { target.classList.add('open'); openPanels.push(target); }
      break;
    case 'close':
      if (target) { target.classList.remove('open'); removeFromStack(target); }
      break;
    case 'toggle':
      if (target) {
        target.classList.toggle('open');
        if (target.classList.contains('open')) openPanels.push(target);
        else removeFromStack(target);
      }
      break;
    case 'tab':
      // target group id; trigger contains data-tab="N"
      const tabGroup = target;
      const tabId = trigger.dataset.tab;
      if (tabGroup) {
        tabGroup.querySelectorAll('[data-tab-panel]').forEach(p =>
          p.classList.toggle('active', p.dataset.tabPanel === tabId)
        );
        tabGroup.querySelectorAll('[data-tab]').forEach(t =>
          t.classList.toggle('active', t.dataset.tab === tabId)
        );
      }
      break;
    case 'zoom-in':
      if (target) target.classList.add('zoomed');
      break;
    case 'zoom-out':
      if (target) target.classList.remove('zoomed');
      break;
    case 'reveal':
      if (target) target.classList.add('revealed');
      break;
    case 'hide':
      if (target) target.classList.remove('revealed');
      break;
  }

  // Hook for per-deck custom actions
  if (typeof window.onTriggerAction === 'function') {
    window.onTriggerAction(action, target, trigger);
  }
});

function removeFromStack(panel) {
  const i = openPanels.lastIndexOf(panel);
  if (i >= 0) openPanels.splice(i, 1);
}

function closeTopmostPanel() {
  const top = openPanels.pop();
  if (top) top.classList.remove('open');
}

/* ==========================================================
   MASTER TIMELINE (composed per deck)
   ==========================================================
   The deck's master GSAP timeline goes below. It should:
     - Define labels for each slide ("slide1", "slide2", ...)
     - Tween shared morph elements (#hero, #title, etc.) between states
     - Be paused; goto() is what triggers the relevant segment
     - Apply the motion preset (easing/duration) chosen in the brief

   See references/morph-animations.md for the patterns.
   See assets/kit/motion-presets.js for the easing/duration configs.

   Example skeleton:

   const tl = gsap.timeline({
     paused: true,
     defaults: { duration: 1.0, ease: "power3.inOut" }  // override per motion preset
   });

   // Slide 1 → Slide 2 transition
   tl.addLabel("slide2");
   tl.to("#hero",  { ...sharedStates.s2.hero  }, "slide2");
   tl.to("#title", { ...sharedStates.s2.title }, "slide2");
   // ...

   // Hook: when slide changes, play to the relevant label
   window.onSlideChange = (target) => {
     const label = `slide${target + 1}`;
     gsap.to(tl, { time: tl.labels[label] || 0, duration: 0.6 });
   };
*/

// [COMPOSED TIMELINE GOES HERE]

</script>
