<!--
  LAYOUT 9 — detail-card-stack
  ============================================
  Three (or 4) cards stacked vertically or in a row. Each holds a sub-topic
  with icon, one-line description, and "Más →" link.

  Role: showing pillars/aspects/options.
  Use with: asymmetric-L, vertical-thirds grids; technical-blueprint, dense-editorial stances.
-->

<div class="slide" data-mode="linear" id="slide-N">
  <h2 class="stack-title">[REPLACE — section title]</h2>

  <div class="card-stack">
    <div class="card">
      <div class="card-icon"><!-- inline SVG icon here, see iconography.md --></div>
      <h3 class="card-h">[REPLACE]</h3>
      <p class="card-body">[REPLACE — one-line description]</p>
      <a class="card-link">Más →</a>
    </div>
    <div class="card">
      <div class="card-icon"></div>
      <h3 class="card-h">[REPLACE]</h3>
      <p class="card-body">[REPLACE]</p>
      <a class="card-link">Más →</a>
    </div>
    <div class="card">
      <div class="card-icon"></div>
      <h3 class="card-h">[REPLACE]</h3>
      <p class="card-body">[REPLACE]</p>
      <a class="card-link">Más →</a>
    </div>
  </div>
</div>

<style>
.stack-title {
  position: absolute;
  top: 80px; left: 80px;
  font-family: var(--display);
  font-size: 64px; font-weight: 700;
  color: var(--text);
  letter-spacing: -1px;
}

.card-stack {
  position: absolute;
  top: 220px; left: 80px; right: 80px;
  display: flex; gap: 32px;
}
.card {
  flex: 1;
  padding: 40px 32px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  transition: transform .25s ease, background .25s ease;
}
.card:hover {
  transform: translateY(-4px);
  background: rgba(255,255,255,0.07);
}

.card-icon {
  width: 36px; height: 36px;
  color: var(--accent);
  margin-bottom: 24px;
}

.card-h {
  font-family: var(--display);
  font-size: 28px; font-weight: 600;
  color: var(--text);
  margin-bottom: 12px;
  letter-spacing: -0.5px;
}

.card-body {
  font-size: 15px; line-height: 1.55;
  color: var(--muted);
  margin-bottom: 24px;
}

.card-link {
  font-size: 13px; letter-spacing: 1px;
  color: var(--accent);
  text-decoration: none;
}
</style>

<!--
  VARIATIONS: 2 cards (wider), 4 cards (more compact). Avoid forcing 3 if topic has 2 or 4.
  MICRO-INTERACTIONS: cards stagger-fade-in on slide entry; hover lifts each card.
-->
