<!--
  LAYOUT 7 — hero-tunnel-perspective
  ============================================
  Hero scaled and transformed with perspective so it feels like looking down
  a tunnel or into a vanishing point. Title centered close to the eye.

  Role: opening OR pivotal slide for topics about depth/exploration.
  Use with: off-canvas-peek grid; fashion-bold, brutalist-asymmetric stances.
-->

<div class="slide" data-mode="linear" id="slide-N">
  <div class="kicker">[REPLACE]</div>
  <h1 class="tunnel-title">[REPLACE]</h1>
  <div class="tunnel-vignette"></div>
</div>

<div id="hero" style="background-image: url('[REPLACE]');"></div>

<style>
#hero {
  position: absolute;
  top: 50%; left: 50%;
  width: 1400px; height: 800px;
  transform: translate(-50%, -50%) perspective(1100px) rotateY(-10deg) scale(1.15);
  transform-origin: center center;
  background-size: cover;
  background-position: center;
  z-index: 3;
  filter: brightness(0.78);
}

.tunnel-vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, rgba(0,0,0,0) 30%, rgba(0,0,0,0.6) 100%);
  z-index: 4;
  pointer-events: none;
}

.kicker {
  position: absolute;
  top: 220px; left: 50%;
  transform: translateX(-50%);
  font-size: 13px; letter-spacing: 4px; text-transform: uppercase;
  color: var(--accent);
  z-index: 5;
}

.tunnel-title {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-family: var(--display);
  font-weight: 700;
  font-size: 128px;
  letter-spacing: -2px;
  color: var(--text);
  text-align: center;
  z-index: 5;
  text-shadow: 0 4px 24px rgba(0,0,0,0.4);
}
</style>

<!--
  MORPH PLAN: hero zooms in further on next slide (scale 1.3), title shrinks.
  PIVOTAL-SLIDE CANDIDATE — works well at the deck's emotional peak.
-->
