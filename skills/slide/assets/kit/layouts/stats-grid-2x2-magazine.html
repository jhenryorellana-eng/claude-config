<!--
  LAYOUT 11 — stats-grid-2x2-magazine
  ============================================
  Four stats in a 2×2 grid. Each cell: big number (72-96px), label, tiny icon.
  Optional thin dividers between cells.

  Role: stats for parallel quantitative facts (not orbiting a center).
  Use with: magazine-spread, rule-of-thirds; dense-editorial, technical-blueprint stances.
-->

<div class="slide" data-mode="linear" id="slide-N">
  <h2 class="grid-title">[REPLACE]</h2>

  <div class="stat-grid">
    <div class="grid-cell">
      <div class="cell-icon"><!-- inline SVG --></div>
      <div class="cell-num">[REPLACE]</div>
      <div class="cell-label">[REPLACE]</div>
    </div>
    <div class="grid-cell">
      <div class="cell-icon"></div>
      <div class="cell-num">[REPLACE]</div>
      <div class="cell-label">[REPLACE]</div>
    </div>
    <div class="grid-cell">
      <div class="cell-icon"></div>
      <div class="cell-num">[REPLACE]</div>
      <div class="cell-label">[REPLACE]</div>
    </div>
    <div class="grid-cell">
      <div class="cell-icon"></div>
      <div class="cell-num">[REPLACE]</div>
      <div class="cell-label">[REPLACE]</div>
    </div>
  </div>
</div>

<style>
.grid-title {
  position: absolute;
  top: 80px; left: 80px;
  font-family: var(--display);
  font-size: 56px; font-weight: 600;
  color: var(--text);
  letter-spacing: -1px;
  max-width: 720px;
}

.stat-grid {
  position: absolute;
  top: 220px; left: 80px; right: 80px; bottom: 80px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 24px;
}

.grid-cell {
  padding: 48px;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  display: flex; flex-direction: column;
}

.cell-icon {
  width: 32px; height: 32px;
  color: var(--accent);
  margin-bottom: auto;
}

.cell-num {
  font-family: var(--display);
  font-size: 88px; font-weight: 700;
  line-height: 1.0; letter-spacing: -2px;
  color: var(--text);
  margin-top: 16px;
}

.cell-label {
  font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--muted);
  margin-top: 8px;
}
</style>

  AVOID for: 3 stats (use stats-vertical-cascade) or 5 stats (use stats-marquee-horizontal).
