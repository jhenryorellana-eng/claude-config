<!--
  LAYOUT 15 — media-showcase-tablet
  ============================================
  Hero and previous stats shift to the left (compacted). From the right slides
  an iPad/tablet/laptop frame carrying video, scenic photo, or screenshot.

  Role: breaking abstract data with concrete media. "Look, here it is in real life."
  Use with: any grid; dense-editorial, documentary-warm stances.
-->

<div class="slide" data-mode="linear" id="slide-N">
  <h3 class="media-context">[REPLACE — context line, 1-2 short sentences]</h3>

  <div id="mediaDevice">
    <div class="device-frame">
      <div class="device-screen">
        <!-- Image OR video. Replace with one of:
             <img src="..." style="width:100%;height:100%;object-fit:cover">
             <video autoplay loop muted><source src="..." type="video/mp4"></video>
        -->
        <div class="screen-placeholder" style="background-image: url('[REPLACE]');"></div>
      </div>
    </div>
    <div class="device-caption">[REPLACE — short italic caption]</div>
  </div>
</div>

<!-- #hero already in left-shifted position via morph -->

<style>
.media-context {
  position: absolute;
  top: 160px; left: 80px;
  width: 360px;
  font-family: var(--display);
  font-size: 32px; font-weight: 600;
  color: var(--text);
  line-height: 1.2;
}

#mediaDevice {
  position: absolute;
  top: 50%; right: 80px;
  transform: translateY(-50%) translateX(800px);
  /* Starts off-screen right; slides in via GSAP on slide entry */
  width: 580px;
  z-index: 6;
}

.device-frame {
  width: 580px; height: 380px;
  background: var(--text);
  border-radius: 12px;
  padding: 18px;
  box-shadow: 0 24px 48px rgba(0,0,0,0.4);
}

.device-screen {
  width: 100%; height: 100%;
  border-radius: 4px;
  overflow: hidden;
  background: var(--bg);
}

.screen-placeholder {
  width: 100%; height: 100%;
  background-size: cover;
  background-position: center;
}

.device-caption {
  margin-top: 18px;
  font-family: var(--display);
  font-style: italic;
  font-size: 17px;
  color: var(--muted);
  text-align: center;
}
</style>

<!--
  AVOID if there's no real media to show. Empty device mockup is worse than skipping this layout.
  VARIATIONS: device frame can be laptop (1100×620 + base) or phone (280×580).
  MICRO-INTERACTION: Ken Burns zoom on screen image (scale 1.0 → 1.06 over 8s, yoyo).
-->
