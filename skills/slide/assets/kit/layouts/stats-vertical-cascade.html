<!--
  LAYOUT 12 — stats-vertical-cascade
  ============================================
  Stats stacked vertically, left-aligned, each LARGER than the one above.
  The biggest stat at the BOTTOM is the load-bearing one (from Q2 of critical-thinking.md).

  Role: stats with editorial drama — building up to the biggest number.
  Use with: vertical-thirds, magazine-spread; dense-editorial, fashion-bold stances.
  PIVOTAL-SLIDE CANDIDATE (the load-bearing stat lives here).
-->

<div class="slide" data-mode="linear" id="slide-N">
  <h2 class="cascade-title">[REPLACE]</h2>

  <div class="cascade">
    <div class="cascade-stat" data-tier="3">
      <span class="csc-num">[REPLACE — smallest stat]</span>
      <span class="csc-label">[REPLACE]</span>
    </div>
    <div class="cascade-stat" data-tier="2">
      <span class="csc-num">[REPLACE — medium stat]</span>
      <span class="csc-label">[REPLACE]</span>
    </div>
    <div class="cascade-stat" data-tier="1">
      <span class="csc-num">[REPLACE — load-bearing stat, biggest]</span>
      <span class="csc-label">[REPLACE]</span>
    </div>
  </div>
</div>

<style>
