<!--
  LAYOUT 4 — hero-split-vertical-asymmetric
  ============================================
  Canvas split vertically into ~35/65 or ~65/35. One side: full-bleed hero.
  Other side: title and short paragraph stacked vertically.

  Role: opening with editorial breathing room.
  Use with: magazine-spread, rule-of-thirds grids; dense-editorial, soft-watercolor stances.
-->

<div class="slide" data-mode="linear" id="slide-N">
  <div class="split-content">
    <div class="kicker">[REPLACE — small caps]</div>
    <h1 class="split-title">[REPLACE — title]</h1>
    <p class="split-body">[REPLACE — 2-3 sentence intro paragraph]</p>
    <button class="btn" data-trigger data-action="open" data-target="#detail-1">[REPLACE — CTA "Más", "Explorar"]</button>
  </div>
</div>

<div id="hero" style="background-image: url('[REPLACE]');"></div>

<style>
#hero {
  position: absolute;
  top: 0; right: 0;
  width: 65%; height: 100%;
  background-size: cover;
  background-position: center;
  z-index: 4;
}

.split-content {
  position: absolute;
  top: 50%; left: 80px;
  width: 32%;
  transform: translateY(-50%);
  z-index: 5;
}

.kicker {
  font-size: 13px; letter-spacing: 3.5px; text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 18px;
}

.split-title {
  font-family: var(--display);
  font-weight: 700;
  font-size: 80px;
  line-height: 1.0;
  letter-spacing: -2px;
  color: var(--text);
  margin-bottom: 32px;
}

.split-body {
  font-size: 18px; line-height: 1.55;
  color: var(--muted);
  margin-bottom: 40px;
}

.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 28px;
  background: var(--accent);
  color: var(--text);
  border: none; border-radius: 999px;
  font-family: var(--body); font-weight: 600; font-size: 15px;
  cursor: pointer;
  transition: transform .2s ease;
}
.btn:hover { transform: translateY(-2px) scale(1.03); }
</style>

<!--
  VARIATIONS: swap left/right by changing #hero { right: 0 } to { left: 0 }
                                          and .split-content { left: 80px } to { right: 80px }.
  MORPH PLAN: #hero scales to centered position on next slide; title shrinks.
-->
