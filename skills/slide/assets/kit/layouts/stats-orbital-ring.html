<!--
  LAYOUT 10 — stats-orbital-ring
  ============================================
  ⚠️  V1 DEFAULT for stats. Hero centered, ring around it, 3-4 plus-icons
      with stat callouts orbiting. Ring rotates slowly.

  AVOID if: this layout was used in the last 2 decks (check memory.json).
  Prefer the alternative stats layouts when memory.json forbids this one.

  Use with: centered-radial grid ONLY; dense-editorial, technical-blueprint stances.
-->

<div class="slide" data-mode="linear" id="slide-N">
  <div id="ring-wrap">
    <svg id="ring" viewBox="0 0 600 600">
      <circle cx="300" cy="300" r="290" fill="none" stroke="var(--accent)" stroke-width="1.5"/>
    </svg>

    <div class="plus-icon" style="top: 5%; left: 70%;">+</div>
    <div class="plus-icon" style="top: 45%; right: -3%;">+</div>
    <div class="plus-icon" style="top: 90%; left: 20%;">+</div>
    <div class="plus-icon" style="top: 30%; left: -3%;">+</div>
  </div>

  <div class="stat" style="top: 8%; left: 78%;">
    <div class="stat-num">[REPLACE]</div>
    <div class="stat-label">[REPLACE]</div>
  </div>
  <div class="stat" style="top: 48%; right: 5%;">
    <div class="stat-num">[REPLACE]</div>
    <div class="stat-label">[REPLACE]</div>
  </div>
  <div class="stat" style="top: 90%; left: 26%;">
    <div class="stat-num">[REPLACE]</div>
    <div class="stat-label">[REPLACE]</div>
  </div>
  <div class="stat" style="top: 33%; left: 5%;">
    <div class="stat-num">[REPLACE]</div>
    <div class="stat-label">[REPLACE]</div>
  </div>
</div>

<style>
#ring-wrap {
  position: absolute;
  top: 50%; left: 50%;
  width: 600px; height: 600px;
  transform: translate(-50%, -50%);
  z-index: 3;
}
.plus-icon {
  position: absolute;
  width: 28px; height: 28px;
  background: var(--accent);
  color: var(--text);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 300;
}

.stat { position: absolute; z-index: 5; color: var(--text); }
.stat-num {
  font-family: var(--display);
  font-size: 72px; font-weight: 700;
  line-height: 1.0; letter-spacing: -1.5px;
}
.stat-label {
  font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--muted);
  margin-top: 4px;
}
</style>

<!--
  MORPH PLAN: ring scales in from 0 with back.out(1.4); plus-icons pulse.
              Ring rotates continuously 60s/rev after appearing.
  MICRO-INTERACTIONS: stat numbers count up from 0 on slide entry.
-->
