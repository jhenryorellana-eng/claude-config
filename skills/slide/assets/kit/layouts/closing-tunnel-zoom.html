<!--
  LAYOUT 17 — closing-tunnel-zoom
  ============================================
  Hero scales beyond 100% and zooms into a single detail until that detail
  fills the screen. Short final CTA or thought appears as the zoom completes.

  Role: final slide for topics where "going deeper" is the message.
  Use with: off-canvas-peek, fullbleed-with-cutout; cinematic-build, techno-pulse motion.

  AVOID if the hero image has no interesting detail to zoom into.
-->

<div class="slide" data-mode="linear" id="slide-N">
  <div class="zoom-final-text">
    <div class="zft-kicker">[REPLACE — small caps prelude]</div>
    <h2 class="zft-headline">[REPLACE — final statement, 5-9 words]</h2>
    <p class="zft-sub">[REPLACE — optional 1-line follow-through]</p>
  </div>
  <div class="zoom-vignette"></div>
</div>

<!-- #hero scales up via morph timeline; final state: scale 1.6, transform-origin pointing to "the detail" -->

<style>
.zoom-vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, rgba(0,0,0,0) 30%, rgba(0,0,0,0.7) 100%);
  z-index: 4;
  pointer-events: none;
}

.zoom-final-text {
  position: absolute;
  bottom: 120px; left: 50%;
  transform: translateX(-50%);
  text-align: center;
  width: 80%;
  z-index: 5;
  opacity: 0;
  /* Fades in after the zoom completes */
}

.zft-kicker {
  font-size: 13px; letter-spacing: 4px; text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 20px;
}

.zft-headline {
  font-family: var(--display);
  font-weight: 700;
  font-size: 72px;
  line-height: 1.05;
  letter-spacing: -1.5px;
  color: var(--text);
  margin-bottom: 16px;
  text-shadow: 0 4px 24px rgba(0,0,0,0.4);
}

.zft-sub {
  font-size: 18px;
  color: var(--muted);
  font-style: italic;
}
</style>

<!--
  MORPH PLAN:
    1. Hero scales from 1.0 to 1.6 with transform-origin set to "the detail" point (1.4s, power2.inOut)
    2. .zoom-vignette fades in (parallel)
    3. After zoom completes: .zoom-final-text fades in (opacity 0 → 1, y 30 → 0)
-->
