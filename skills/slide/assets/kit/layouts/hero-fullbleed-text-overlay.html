  or bottom-right) with semi-transparent backing or directly on the image.

  Role: immersive opening OR pivotal mid-deck moment.
  Use with: fullbleed-with-cutout grid; fashion-bold, minimal-poetic stances.
  Pivotal-slide candidate.
-->
