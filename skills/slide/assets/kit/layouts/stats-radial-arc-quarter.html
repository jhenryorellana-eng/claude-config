<!--
  LAYOUT 13 — stats-radial-arc-quarter
  ============================================
  A quarter-circle arc in one corner of the canvas. Three stats sit along
  the arc at evenly-spaced points. Hero sits in the opposite corner, small.

  Role: elegant restrained alternative to the orbital ring.
  Use with: asymmetric-L, centered-radial; soft-watercolor, minimal-poetic stances.
-->

<div class="slide" data-mode="linear" id="slide-N">
  <svg class="quarter-arc" viewBox="0 0 700 700">
    <path d="M 0 0 A 700 700 0 0 0 700 700" fill="none" stroke="var(--accent)" stroke-width="1.5"/>
  </svg>

  <div class="arc-stat" style="top: 14%; right: 18%;">
    <div class="as-num">[REPLACE]</div>
    <div class="as-label">[REPLACE]</div>
  </div>
  <div class="arc-stat" style="top: 42%; right: 4%;">
    <div class="as-num">[REPLACE]</div>
    <div class="as-label">[REPLACE]</div>
  </div>
  <div class="arc-stat" style="top: 72%; right: 18%;">
    <div class="as-num">[REPLACE]</div>
    <div class="as-label">[REPLACE]</div>
  </div>
</div>

<!-- #hero positioned small bottom-left via morph -->

<style>
.quarter-arc {
  position: absolute;
  top: -100px; right: -100px;
  width: 900px; height: 900px;
  z-index: 3;
  pointer-events: none;
}

.arc-stat {
  position: absolute;
  text-align: right;
  z-index: 5;
}
.as-num {
  font-family: var(--display);
  font-size: 60px; font-weight: 700;
  line-height: 1.0; letter-spacing: -1.5px;
  color: var(--text);
}
.as-label {
  font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--muted);
  margin-top: 4px;
}
</style>

<!--
  AVOID for >3 stats. The arc geometry doesn't support 4+.
  MORPH PLAN: arc draws via stroke-dashoffset on slide entry.
-->
