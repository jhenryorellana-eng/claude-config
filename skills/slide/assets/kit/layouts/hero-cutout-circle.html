<!--
  LAYOUT 6 — hero-cutout-circle
  ============================================
  Hero image masked into a circle (or oval) sitting at 30% or 70% of the
  horizontal axis. Title beside it.

  Role: opening with portrait-like intimacy.
  Use with: rule-of-thirds grid; minimal-poetic, soft-watercolor stances.
-->

<div class="slide" data-mode="linear" id="slide-N">
  <div class="kicker">[REPLACE]</div>
  <h1 class="cutout-title">[REPLACE — title, can wrap to 2 lines]</h1>
</div>

<div id="hero" style="background-image: url('[REPLACE]');"></div>

<style>
#hero {
  position: absolute;
  top: 50%; right: 120px;
  transform: translateY(-50%);
  width: 440px; height: 440px;
  border-radius: 50%;
  background-size: cover;
  background-position: center;
  z-index: 4;
}

.kicker {
  position: absolute;
  top: 200px; left: 96px;
  font-size: 13px; letter-spacing: 4px; text-transform: uppercase;
  color: var(--accent);
}

.cutout-title {
  position: absolute;
  top: 256px; left: 96px;
  max-width: 540px;
  font-family: var(--display);
  font-weight: 600;
  font-size: 96px;
  line-height: 1.0;
  letter-spacing: -2px;
  color: var(--text);
  z-index: 6;
}
</style>

<!--
  VARIATIONS: ellipse instead of circle (width: 540px; height: 380px; border-radius: 50%).
  MORPH PLAN: circle hero scales down and moves to corner; title shrinks.
  GOES WELL with: archival chrome, minimal-rail chrome.
-->
